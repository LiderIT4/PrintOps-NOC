<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Enterprise PrintOps Manager</title>
    
    <!-- React & Router -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
    <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
    <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

    <!-- Theme Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#136dec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                        "surface-dark": "#181b21",
                        "surface-darker": "#151e29",
                        "border-dark": "#2d3748",
                        "card-dark": "#1c2027",
                        "card-border": "#282f39",
                        "text-secondary": "#9da8b9",
                        // Screen 3 NOC Specifics
                        noc: {
                            bg: '#0b0f19',
                            card: '#161e2e',
                            border: '#2a3447',
                            sidebar: '#0f1420',
                        },
                        slate: {
                            750: '#2d3748',
                            850: '#1a202c',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        // Inks
                        "ink-cyan": "#06b6d4",
                        "ink-magenta": "#e879f9",
                        "ink-yellow": "#facc15",
                        "ink-black": "#f8fafc",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "sans": ["Inter", "sans-serif"],
                        "mono": ["ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "Liberation Mono", "Courier New", "monospace"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #101822;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3b4554;
            border-radius: 4px;
        }
        .chart-grid {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        // --- Screen 1: Inventory Details ---
        
        const InventoryDetailsPage = () => {
            const [printers, setPrinters] = useState([]);
            const location = useLocation();
            const [loading, setLoading] = useState(true);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [authPrinter, setAuthPrinter] = useState(null);
            const [credentials, setCredentials] = useState({ user: 'admin', pass: '' });

            useEffect(() => {
                fetch('/api/printers')
                    .then(res => res.json())
                    .then(data => {
                        setPrinters(data.printers || []);
                        setLoading(false);
                    });

                const es = new EventSource('/api/printers/status-stream');
                es.onmessage = e => {
                    if (e.data === 'Escaneo completado') return;
                    try {
                        // Limpieza de posibles espacios para asegurar el parseo
                        const cleanData = e.data.trim();
                        if (!cleanData.startsWith('{')) return;
                        
                        const obj = JSON.parse(cleanData);
                        if (obj.type === 'AUTH_REQUIRED') {
                            setAuthPrinter({ name: obj.printerName, ip: obj.ip });
                            setShowAuthModal(true);
                            return;
                        }
                        if (obj.printer) {
                            setPrinters(prev => prev.map(p => 
                                p.name === obj.printer.name ? { ...p, cached: obj.printer } : p
                            ));
                        }
                    } catch (err) {
                        console.error("Error al procesar mensaje del stream:", err, e.data);
                    }
                };
                return () => es.close();
            }, []);

            const renderInkLevels = (levels) => {
                if (!levels || !levels.length) return <span className="text-xs text-gray-500 italic">Cargando...</span>;
                return (
                    <div className="flex gap-2 items-center h-full">
                        {levels.map((t, i) => {
                            const m = t.match(/([\wÁÉÍÓÚáéíóúñÑ]+).*?(\d+)%/i);
                            if (!m) return null;
                            const color = m[1].toLowerCase();
                            const pct = parseInt(m[2]);
                            const cssColor =
                                (/black/.test(color)) ? 'bg-slate-300' :
                                (/cyan/.test(color)) ? 'bg-cyan-400' :
                                (/magenta/.test(color)) ? 'bg-pink-500' :
                                (/yellow/.test(color)) ? 'bg-yellow-400' : 'bg-green-400';
                            return (
                                <div key={i} className="flex flex-col items-center gap-0.5" title={`${color}: ${pct}%`}>
                                    <div className="h-8 w-2.5 bg-gray-700 rounded-sm relative overflow-hidden">
                                        <div className={`absolute bottom-0 w-full ${cssColor}`} style={{height: `${pct}%`}}></div>
                                    </div>
                                    <span className={`text-[9px] font-medium ${pct < 10 ? 'text-red-400 font-bold' : pct <= 20 ? 'text-orange-400 font-bold' : 'text-gray-400'}`}>{pct}%</span>
                                </div>
                            );
                        })}
                    </div>
                );
            };

            const retryPrinter = (ip, user = '', pass = '') => {
                let url = `/api/printers/retry?ip=${ip}`;
                if (user) url += `&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`;
                
                fetch(url)
                    .then(r => r.json())
                    .then(data => {
                        if (data && data.name) {
                            setPrinters(prev => prev.map(p => 
                                p.name === data.name ? { ...p, cached: data } : p
                            ));
                            setShowAuthModal(false); // <--- Cerramos el modal tras el reintento exitoso
                        }
                    })
                    .catch(err => {
                        console.error("Error en el reintento:", err);
                    });
            };

            const activeUnits = printers.filter(p => p.cached && p.cached.status === 'online').length;
            const totalUnits = printers.length;
            const utilization = totalUnits > 0 ? Math.round((activeUnits / totalUnits) * 100) : 0;

            return (
                <div className="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white overflow-x-hidden min-h-screen flex flex-col">
                    {/* Top Navigation */}
                    <div className="w-full bg-[#111418] border-b border-[#282f39]">
                        <div className="px-6 lg:px-10 py-3 flex items-center justify-between">
                            <div className="flex items-center gap-8">
                                <div className="flex items-center gap-4 text-white">
                                    <div className="size-8 flex items-center justify-center bg-primary/20 rounded-lg text-primary">
                                        <span className="material-symbols-outlined">print</span>
                                    </div>
                                    <h2 className="text-white text-lg font-bold leading-tight tracking-[-0.015em]">Enterprise Print Manager</h2>
                                </div>
                                <div className="hidden md:flex items-center gap-6">
                                    <Link className={`${location.pathname === '/' ? 'text-white border-b-2 border-primary pb-4 -mb-4' : 'text-gray-400 hover:text-white'} text-sm font-medium transition-colors`} to="/">Dashboard</Link>
                                    <Link className={`${location.pathname === '/supplies' ? 'text-white border-b-2 border-primary pb-4 -mb-4' : 'text-gray-400 hover:text-white'} text-sm font-medium transition-colors`} to="/supplies">Insumos</Link>
                                </div>
                            </div>
                        </div>
                    </div>
                    {/* Main Content */}
                    <div className="flex-1 flex flex-col max-w-[1440px] mx-auto w-full px-4 md:px-6 lg:px-8 py-6">
                        {/* Header Area */}
                        <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
                            <div className="flex flex-col gap-2">
                                <h1 className="text-3xl md:text-4xl font-black text-white tracking-tight">Printers Inventory</h1>
                                <p className="text-[#9da8b9] text-sm md:text-base">Real-time status of all configured printers</p>
                            </div>
                            <button className="flex items-center gap-2 bg-[#282f39] hover:bg-[#323b47] text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors w-fit border border-transparent hover:border-gray-600" onClick={() => window.location.reload()}>
                                <span className="material-symbols-outlined" style={{fontSize: '18px'}}>refresh</span>
                                <span>Reload App</span>
                            </button>
                        </div>
                        {/* Metric Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                            <div className="bg-surface-dark border border-border-dark rounded-xl p-6 relative overflow-hidden group">
                                <div className="absolute right-0 top-0 p-6 opacity-10 group-hover:opacity-20 transition-opacity">
                                    <span className="material-symbols-outlined text-white" style={{fontSize: '64px'}}>devices</span>
                                </div>
                                <p className="text-[#9da8b9] text-sm font-medium uppercase tracking-wider mb-2">Active Units</p>
                                <div className="flex items-baseline gap-3">
                                    <span className="text-4xl font-bold text-white">{activeUnits}</span>
                                    <span className="text-gray-400 text-sm">/ {totalUnits}</span>
                                </div>
                                <div className="mt-4 h-1 w-full bg-[#282f39] rounded-full overflow-hidden">
                                    <div className="h-full bg-primary transition-all duration-500" style={{width: `${utilization}%`}}></div>
                                </div>
                                <p className="text-xs text-[#9da8b9] mt-2">{utilization}% Online utilization</p>
                            </div>
                        </div>
                        {/* Table */}
                        <div className="bg-surface-dark border border-border-dark rounded-xl flex flex-col shadow-xl">
                            <div className="overflow-x-auto custom-scrollbar rounded-xl">
                                <table className="w-full text-left border-collapse min-w-full">
                                    <thead>
                                        <tr className="bg-[#101822] border-b border-border-dark text-[#9da8b9] text-xs uppercase tracking-wider font-semibold">
                                            <th className="p-4">Device Name</th>
                                            <th className="p-4">IP Address</th>
                                            <th className="p-4">Model</th>
                                            <th className="p-4">Status</th>
                                            <th className="p-4">Pages</th>
                                            <th className="p-4">Ink Levels</th>
                                            <th className="p-4 text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-border-dark">
                                        {printers.map((printer) => {
                                            const ip = printer.url.split('://')[1].split('/')[0];
                                            const isOnline = printer.cached && printer.cached.status === 'online';
                                            
                                            let hasWarning = false;
                                            let hasDanger = false;
                                            if (printer.cached && printer.cached.inkLevels) {
                                                printer.cached.inkLevels.forEach(t => {
                                                    const m = t.match(/([\wÁÉÍÓÚáéíóúñÑ]+).*?(\d+)%/i);
                                                    if (m) {
                                                        const pct = parseInt(m[2]);
                                                        if (pct < 10) hasDanger = true;
                                                        else if (pct >= 10 && pct <= 20) hasWarning = true;
                                                    }
                                                });
                                            }

                                            let rowClass = "group transition-colors border-l-2 border-l-transparent";
                                            if (hasDanger) {
                                                rowClass += " bg-red-900/20 animate-pulse border-l-red-500 hover:bg-red-900/30";
                                            } else if (hasWarning) {
                                                rowClass += " bg-orange-900/20 animate-pulse border-l-orange-500 hover:bg-orange-900/30";
                                            } else {
                                                rowClass += " hover:bg-[#20252e] hover:border-l-primary";
                                            }

                                            return (
                                                <tr key={printer.name} className={rowClass}>
                                                    <td className="p-4">
                                                        <div className="flex items-center gap-2">
                                                            <div className="text-white font-semibold text-sm">{printer.name}</div>
                                                            {hasDanger && <span className="material-symbols-outlined text-red-500" style={{fontSize: '18px'}} title="Critical Ink Level">error</span>}
                                                            {!hasDanger && hasWarning && <span className="material-symbols-outlined text-orange-500" style={{fontSize: '18px'}} title="Low Ink Level">warning</span>}
                                                        </div>
                                                    </td>
                                                    <td className="p-4"><span className="font-mono text-gray-300 text-sm bg-[#101822] px-2 py-1 rounded border border-border-dark">{ip}</span></td>
                                                    <td className="p-4 text-gray-400 text-sm">{printer.model}</td>
                                                    <td className="p-4">
                                                        {isOnline ? (
                                                            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-[#0bda5e]/10 text-[#0bda5e]">
                                                                <span className="size-1.5 rounded-full bg-[#0bda5e]"></span> Online
                                                            </span>
                                                        ) : printer.cached ? (
                                                            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-500">
                                                                <span className="size-1.5 rounded-full bg-red-500"></span> Offline
                                                            </span>
                                                        ) : (
                                                            <span className="text-gray-500 text-xs italic">Pending...</span>
                                                        )}
                                                    </td>
                                                    <td className="p-4 font-mono text-gray-300 text-sm">
                                                        {printer.cached && printer.cached.inkLevels ? (
                                                            <div className="flex flex-col gap-0.5">
                                                                {printer.cached.inkLevels.find(t => /^Pages:/.test(t)) && (
                                                                    <div className="text-white font-bold">{printer.cached.inkLevels.find(t => /^Pages:/.test(t)).split(':')[1].trim()}</div>
                                                                )}
                                                                {printer.cached.inkLevels.find(t => /BW Pages:/.test(t)) && (
                                                                    <div className="text-[10px] text-gray-500">B/W: {printer.cached.inkLevels.find(t => /BW Pages:/.test(t)).split(':')[1].trim()}</div>
                                                                )}
                                                                {printer.cached.inkLevels.find(t => /Color Pages:/.test(t)) && (
                                                                    <div className="text-[10px] text-gray-500">Color: {printer.cached.inkLevels.find(t => /Color Pages:/.test(t)).split(':')[1].trim()}</div>
                                                                )}
                                                                {!printer.cached.inkLevels.some(t => t.includes('Pages:')) && '--'}
                                                            </div>
                                                        ) : '--'}
                                                    </td>
                                                    <td className="p-4">{renderInkLevels(printer.cached && printer.cached.inkLevels)}</td>
                                                    <td className="p-4 text-right">
                                                        <button 
                                                            onClick={() => retryPrinter(ip)}
                                                            className="px-3 py-1.5 bg-[#101822] border border-border-dark hover:bg-[#20252e] rounded text-xs font-medium text-gray-300 transition-colors">
                                                            Retry
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                        {printers.length === 0 && !loading && (
                                            <tr><td colSpan="7" className="p-6 text-center text-gray-400">No printers found.</td></tr>
                                        )}
                                        {loading && (
                                            <tr><td colSpan="7" className="p-6 text-center text-gray-400">Loading printers data...</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    {/* Authentication Modal */}
                    {showAuthModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                            <div className="bg-surface-dark border border-border-dark w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
                                <div className="p-6 border-b border-border-dark">
                                    <div className="flex items-center gap-3 text-white mb-1">
                                        <span className="material-symbols-outlined text-primary">lock</span>
                                        <h3 className="text-xl font-bold tracking-tight">Authentication Required</h3>
                                    </div>
                                    <p className="text-gray-400 text-sm">Please enter credentials for <strong>{authPrinter && authPrinter.name}</strong> ({authPrinter && authPrinter.ip})</p>
                                </div>
                                <div className="p-6 space-y-4">
                                    <div className="space-y-2">
                                        <label className="text-xs font-bold text-gray-400 uppercase tracking-wider">Username</label>
                                        <input 
                                            type="text" 
                                            className="w-full bg-[#101822] border border-border-dark rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all"
                                            value={credentials.user}
                                            onChange={(e) => setCredentials({...credentials, user: e.target.value})}
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-xs font-bold text-gray-400 uppercase tracking-wider">Password</label>
                                        <input 
                                            type="password" 
                                            className="w-full bg-[#101822] border border-border-dark rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all"
                                            value={credentials.pass}
                                            onChange={(e) => setCredentials({...credentials, pass: e.target.value})}
                                            onKeyDown={(e) => e.key === 'Enter' && authPrinter && retryPrinter(authPrinter.ip, credentials.user, credentials.pass)}
                                            autoFocus
                                        />
                                    </div>
                                </div>
                                <div className="p-6 bg-[#101822]/50 flex gap-3 justify-end">
                                    <button 
                                        onClick={() => setShowAuthModal(false)}
                                        className="px-4 py-2 text-sm font-bold text-gray-400 hover:text-white transition-colors">
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={() => authPrinter && retryPrinter(authPrinter.ip, credentials.user, credentials.pass)}
                                        className="px-6 py-2 bg-primary hover:bg-blue-600 text-white text-sm font-bold rounded-lg shadow-lg shadow-primary/20 transition-all">
                                        Authenticating & Retry
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Screen 2: Printer Monitor ---
        const PrinterMonitorPage = () => {
            return (
                <div className="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display min-h-screen flex flex-col overflow-x-hidden antialiased">
                    {/* Top Navigation */}
                    <div className="border-b border-card-border bg-card-dark px-6 py-3 flex items-center justify-between sticky top-0 z-50">
                        <div className="flex items-center gap-4">
                            <div className="size-8 flex items-center justify-center rounded bg-primary/20 text-primary">
                                <span className="material-symbols-outlined">print</span>
                            </div>
                            <h2 className="text-lg font-bold tracking-tight">Printer Monitor</h2>
                            <div className="hidden md:flex h-6 w-px bg-card-border mx-2"></div>
                            <nav className="hidden md:flex items-center gap-2 text-sm">
                                <Link className="text-text-secondary hover:text-white transition-colors" to="/">Dashboard</Link>
                                <span className="text-text-secondary">/</span>
                                <Link className="text-text-secondary hover:text-white transition-colors" to="/inventory">Printers</Link>
                                <span className="text-text-secondary">/</span>
                                <span className="text-white font-medium">HP LaserJet Pro M404n</span>
                            </nav>
                        </div>
                        <div className="flex items-center gap-4">
                            <button className="flex items-center justify-center size-8 rounded-full hover:bg-card-border transition-colors text-text-secondary">
                                <span className="material-symbols-outlined text-[20px]">notifications</span>
                            </button>
                            <div className="size-8 rounded-full bg-cover bg-center ring-2 ring-card-border" style={{backgroundImage: 'url("https://lh3.googleusercontent.com/aida-public/AB6AXuAjD5lMjtLMjsc0-8NL8ZqQSH6lLwspbz8YSymEPXV7ArqdX2v6LbHEPG6zxBnv_jRzRBEJ0mdw6d5O4VhNF8gvUHhwdjL1NN8EQAF2mx-nn7swc__7mIMrJ4WF-COXjQHrNDCbUH-1mOJOGoJj-6k1Rd8_frsw_7Qvzj4CJUJd6Lsw85I0j9froQmLzOTE5gZ9F9xOORr4MvhzE1akKaXEbAzX0fH8Igk2kTANTXgG02vkb-cAgnSMZ7tNyvGQjPbMhokYwH3ln5hs")'}}></div>
                        </div>
                    </div>
                    {/* Main Content */}
                    <main className="flex-1 p-6 md:p-10 max-w-[1600px] mx-auto w-full flex flex-col gap-6">
                        {/* Header Section */}
                        <header className="flex flex-col md:flex-row md:items-end justify-between gap-6 pb-2">
                            <div className="flex flex-col gap-2">
                                <div className="flex items-center gap-3">
                                    <h1 className="text-3xl md:text-4xl font-black tracking-tight text-white">HP LaserJet Pro M404n</h1>
                                    <span className="inline-flex items-center gap-1.5 rounded-full bg-emerald-500/15 px-3 py-1 text-xs font-bold uppercase tracking-wide text-emerald-400 border border-emerald-500/20">
                                        <span className="size-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                        Online
                                    </span>
                                </div>
                                <div className="flex flex-wrap items-center gap-x-6 gap-y-2 text-sm text-text-secondary font-medium">
                                    <span className="flex items-center gap-2">
                                        <span className="material-symbols-outlined text-[18px]">dns</span>
                                        <span className="font-mono text-white/90">192.168.1.45</span>
                                    </span>
                                    <span className="flex items-center gap-2">
                                        <span className="material-symbols-outlined text-[18px]">location_on</span>
                                        Floor 2, East Wing, Room 204
                                    </span>
                                    <span className="flex items-center gap-2">
                                        <span className="material-symbols-outlined text-[18px]">verified</span>
                                        Managed Device
                                    </span>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <button className="h-10 px-4 rounded-lg bg-card-dark border border-card-border hover:bg-card-border transition-colors text-white text-sm font-bold flex items-center gap-2">
                                    <span className="material-symbols-outlined text-[20px]">settings</span>
                                    Config
                                </button>
                                <button className="h-10 px-4 rounded-lg bg-primary hover:bg-blue-600 transition-colors text-white text-sm font-bold flex items-center gap-2 shadow-[0_0_15px_rgba(19,109,236,0.3)]">
                                    <span className="material-symbols-outlined text-[20px]">refresh</span>
                                    Refresh Data
                                </button>
                            </div>

                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Most Active Printer</p>
                                                <h3 className="text-xl font-bold text-primary mt-1 truncate max-w-[200px]" title="Marketing_Floor2_HP">Marketing_Floor2_HP</h3>
                                            </div>
                                            <div className="w-8 h-8 rounded-lg bg-primary/10 flex items-center justify-center">
                                                <span className="material-icons text-primary text-sm">emoji_events</span>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2 mt-2">
                                            <div className="w-full bg-gray-200 dark:bg-gray-700 h-1.5 rounded-full overflow-hidden">
                                                <div className="bg-primary h-full rounded-full" style={{width: '78%'}}></div>
                                            </div>
                                            <span className="text-xs font-medium text-gray-900 dark:text-white whitespace-nowrap">3,204 pgs</span>
                                        </div>
                                    </div>
                                    <div className="bg-white dark:bg-surface-dark rounded-xl p-6 border border-gray-200 dark:border-gray-800 shadow-sm flex items-center justify-between">
                                        <div>
                                            <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Print Type Distribution</p>
                                            <ul className="space-y-2 text-sm">
                                                <li className="flex items-center gap-2 text-gray-300">
                                                    <span className="w-3 h-3 rounded-full bg-gray-500"></span>
                                                    <span className="text-gray-600 dark:text-gray-400">B/W</span>
                                                    <span className="font-bold text-gray-900 dark:text-white ml-auto">85%</span>
                                                </li>
                                                <li className="flex items-center gap-2 text-gray-300">
                                                    <span className="w-3 h-3 rounded-full bg-blue-500"></span>
                                                    <span className="text-gray-600 dark:text-gray-400">Color</span>
                                                    <span className="font-bold text-gray-900 dark:text-white ml-auto">15%</span>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white dark:bg-surface-dark rounded-xl border border-gray-200 dark:border-gray-800 overflow-hidden">
                                    <div className="px-6 py-4 border-b border-gray-200 dark:border-gray-800">
                                        <h3 className="font-semibold text-gray-900 dark:text-white">Recent Alerts</h3>
                                    </div>
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-gray-50 dark:bg-surface-darker text-gray-500 dark:text-gray-400 uppercase font-medium text-xs">
                                            <tr>
                                                <th className="px-6 py-3">Severity</th>
                                                <th className="px-6 py-3">Device Name</th>
                                                <th className="px-6 py-3">Message</th>
                                                <th className="px-6 py-3">Time</th>
                                                <th className="px-6 py-3 text-right">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-200 dark:divide-gray-800">
                                            <tr>
                                                <td className="px-6 py-4">
                                                    <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400">Critical</span>
                                                </td>
                                                <td className="px-6 py-4 font-medium text-gray-900 dark:text-white">Lobby_Reception</td>
                                                <td className="px-6 py-4 text-gray-600 dark:text-gray-300">Toner Empty (Black)</td>
                                                <td className="px-6 py-4 text-gray-500">12 min ago</td>
                                                <td className="px-6 py-4 text-right">
                                                    <button className="text-primary hover:text-primary/80 font-medium">Resolve</button>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        
        // --- Screen 5: Supplies Inventory Management ---
        const SuppliesInventoryPage = () => {
            const [printers, setPrinters] = useState([]);
            const [inventory, setInventory] = useState({});
            const [loading, setLoading] = useState(true);
            const [showAddModelModal, setShowAddModelModal] = useState(false);
            const [newModelName, setNewModelName] = useState('');
            const [isEditing, setIsEditing] = useState(false);
            const [collapsedModels, setCollapsedModels] = useState({});
            const location = useLocation();

            const tipoItems = ["Botella de tinta", "Cabezal de Impresión", "Toner", "Cartucho", "Developer Unit", "Tambor"];
            const colorItems = ["TRICOLOR", "B&W", "CIAN", "YELLOW", "MAGENTA", "KEY"];

            const toggleCollapse = (model) => {
                setCollapsedModels(prev => ({ ...prev, [model]: !prev[model] }));
            };

            const collapseAll = () => {
                const newCollapsed = {};
                models.forEach(m => newCollapsed[m] = true);
                setCollapsedModels(newCollapsed);
            };

            const expandAll = () => {
                setCollapsedModels({});
            };

            useEffect(() => {
                Promise.all([
                    fetch('/api/printers').then(res => res.json()),
                    fetch('/api/inventory').then(res => res.json())
                ]).then(([printersData, inventoryData]) => {
                    setPrinters(printersData.printers || []);
                    setInventory(inventoryData || {});
                    setLoading(false);
                });
            }, []);

            const models = [...new Set([...printers.map(p => p.model), ...Object.keys(inventory)])].sort();

            const handleAddModel = () => {
                const model = newModelName.trim();
                if (!model) return;
                
                if (inventory[model]) {
                    setShowAddModelModal(false);
                    setNewModelName('');
                    return;
                }

                const defaultSupplies = [
                    { type: tipoItems[2], reference: "", color: colorItems[1], minStock: 1, currentStock: 1 }
                ];
                
                const updatedInv = { ...inventory, [model]: { supplies: defaultSupplies, offices: "" } };
                setInventory(updatedInv);
                saveInventory(model, defaultSupplies, "");
                setShowAddModelModal(false);
                setNewModelName('');
            };

            const handleAddRow = (model) => {
                const modelData = inventory[model] || { supplies: [], offices: "" };
                const newRow = { type: tipoItems[0], reference: "", color: colorItems[1], minStock: 1, currentStock: 1 };
                const updatedSupplies = [...modelData.supplies, newRow];
                const updatedInv = { ...inventory, [model]: { ...modelData, supplies: updatedSupplies } };
                setInventory(updatedInv);
                saveInventory(model, updatedSupplies, modelData.offices);
            };

            const handleRemoveRow = (model, index) => {
                const modelData = inventory[model];
                const updatedSupplies = modelData.supplies.filter((_, i) => i !== index);
                const updatedInv = { ...inventory, [model]: { ...modelData, supplies: updatedSupplies } };
                setInventory(updatedInv);
                saveInventory(model, updatedSupplies, modelData.offices);
            };

            const handleChange = (model, index, field, value) => {
                const modelData = inventory[model];
                const updatedSupplies = [...modelData.supplies];
                updatedSupplies[index] = { ...updatedSupplies[index], [field]: value };
                const updatedInv = { ...inventory, [model]: { ...modelData, supplies: updatedSupplies } };
                setInventory(updatedInv);
            };

            const handleOfficeChange = (model, value) => {
                const modelData = inventory[model] || { supplies: [], offices: "" };
                const updatedInv = { ...inventory, [model]: { ...modelData, offices: value } };
                setInventory(updatedInv);
            };

            const handleBlur = (model) => {
                const modelData = inventory[model];
                saveInventory(model, modelData.supplies, modelData.offices);
            };

            const adjustStock = (model, index, delta) => {
                const modelData = inventory[model];
                const updatedSupplies = [...modelData.supplies];
                const newStock = (updatedSupplies[index].currentStock || 0) + delta;
                updatedSupplies[index] = { ...updatedSupplies[index], currentStock: Math.max(0, newStock) };
                const updatedInv = { ...inventory, [model]: { ...modelData, supplies: updatedSupplies } };
                setInventory(updatedInv);
                saveInventory(model, updatedSupplies, modelData.offices);
            };

            const saveInventory = (model, supplies, offices) => {
                fetch('/api/inventory/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model, supplies, offices })
                });
            };

            return (
                <div className="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white min-h-screen flex flex-col">
                    {/* Top Navigation */}
                    <div className="w-full bg-[#111418] border-b border-[#282f39]">
                        <div className="px-6 lg:px-10 py-3 flex items-center justify-between">
                            <div className="flex items-center gap-8">
                                <div className="flex items-center gap-4 text-white">
                                    <div className="size-8 flex items-center justify-center bg-primary/20 rounded-lg text-primary">
                                        <span className="material-symbols-outlined">inventory</span>
                                    </div>
                                    <h2 className="text-white text-lg font-bold leading-tight tracking-[-0.015em]">Enterprise Print Manager</h2>
                                </div>
                                <div className="hidden md:flex items-center gap-6">
                                    <Link className={`${location.pathname === '/' ? 'text-white border-b-2 border-primary pb-4 -mb-4' : 'text-gray-400 hover:text-white'} text-sm font-medium transition-colors`} to="/">Dashboard</Link>
                                    <Link className={`${location.pathname === '/supplies' ? 'text-white border-b-2 border-primary pb-4 -mb-4' : 'text-gray-400 hover:text-white'} text-sm font-medium transition-colors`} to="/supplies">Insumos</Link>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col max-w-[1440px] mx-auto w-full px-4 md:px-6 lg:px-8 py-6">
                        {/* Header Area */}
                        <div className="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-10">
                            <div className="flex flex-col gap-2">
                                <h1 className="text-3xl md:text-4xl font-black text-white tracking-tight">Inventario de Insumos</h1>
                                <p className="text-[#9da8b9] text-sm md:text-base">Gestión de stock agrupada por modelo de impresora</p>
                            </div>
                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={() => setIsEditing(!isEditing)}
                                    className={`flex items-center gap-2 px-6 py-3 rounded-xl text-sm font-bold transition-all border shadow-xl ${isEditing ? 'bg-amber-500 hover:bg-amber-600 text-white border-amber-600' : 'bg-primary hover:bg-blue-600 text-white border-primary'}`}>
                                    <span className="material-symbols-outlined" style={{fontSize: '22px'}}>{isEditing ? 'lock_open' : 'edit'}</span>
                                    <span>{isEditing ? 'Guardar Cambios' : 'Modo Edición'}</span>
                                </button>
                                <button 
                                    onClick={() => setShowAddModelModal(true)}
                                    className="flex items-center gap-2 bg-[#2d3748] hover:bg-[#3b4554] text-white px-6 py-3 rounded-xl text-sm font-bold transition-all border border-[#4a5568] shadow-xl hover:scale-[1.02] active:scale-[0.98]">
                                    <span className="material-symbols-outlined" style={{fontSize: '22px'}}>add_circle</span>
                                    <span>Agregar Nueva Impresora</span>
                                </button>
                                <div className="h-10 w-px bg-border-dark mx-1"></div>
                                <div className="flex bg-[#101822] border border-border-dark rounded-xl p-1 shadow-xl">
                                    <button 
                                        onClick={expandAll}
                                        title="Expandir Todo"
                                        className="size-10 flex items-center justify-center rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-all">
                                        <span className="material-symbols-outlined">unfold_more</span>
                                    </button>
                                    <button 
                                        onClick={collapseAll}
                                        title="Colapsar Todo"
                                        className="size-10 flex items-center justify-center rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-all">
                                        <span className="material-symbols-outlined">unfold_less</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {loading ? (
                            <div className="flex justify-center p-20"><p className="text-gray-500 animate-pulse">Cargando inventario...</p></div>
                        ) : (
                            <div className="space-y-10">
                                {models.map(model => {
                                    const modelData = inventory[model] || { supplies: [], offices: "" };
                                    const isCollapsed = collapsedModels[model];
                                    return (
                                        <div key={model} className="bg-surface-dark border border-border-dark rounded-xl overflow-hidden shadow-lg transition-all hover:border-gray-700">
                                            <div className="bg-[#101822] border-b border-border-dark flex flex-col gap-4">
                                                <div 
                                                    onClick={() => toggleCollapse(model)}
                                                    className="px-6 py-4 flex items-center justify-between cursor-pointer hover:bg-white/5 transition-colors">
                                                    <div className="flex items-center gap-4">
                                                        <span className={`material-symbols-outlined text-gray-500 transition-transform duration-200 ${isCollapsed ? '-rotate-90' : ''}`}>expand_more</span>
                                                        <div className="flex flex-col">
                                                            <h3 className="text-xl font-bold text-white uppercase tracking-wide leading-tight">{model}</h3>
                                                            {modelData.offices && (
                                                                <span className="text-sm text-text-secondary font-medium flex items-center gap-1 mt-0.5">
                                                                    <span className="material-symbols-outlined text-[16px]">apartment</span>
                                                                    {modelData.offices}
                                                                </span>
                                                            )}
                                                        </div>
                                                        <span className="text-xs bg-primary/10 text-primary px-3 py-1 rounded-full font-bold h-fit">
                                                            {printers.filter(p => p.model === model).length} impresoras
                                                        </span>
                                                    </div>
                                                    <button 
                                                        disabled={!isEditing}
                                                        onClick={(e) => { e.stopPropagation(); handleAddRow(model); }}
                                                        className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-lg ${isEditing ? 'bg-primary hover:bg-blue-600 text-white shadow-primary/20' : 'bg-gray-700 text-gray-400 cursor-not-allowed opacity-50'}`}>
                                                        <span className="material-symbols-outlined" style={{fontSize: '18px'}}>add</span>
                                                        Agregar Insumo
                                                    </button>
                                                </div>
                                                
                                                {!isCollapsed && (
                                                    <div className="px-6 pb-4 flex items-center gap-3">
                                                        <span className="material-symbols-outlined text-gray-500 text-[20px]">apartment</span>
                                                        <input 
                                                            type="text" 
                                                            disabled={!isEditing}
                                                            className={`flex-1 bg-[#151e29] border border-border-dark rounded-lg px-4 py-2 text-sm text-gray-300 focus:ring-1 focus:ring-primary outline-none transition-all ${!isEditing ? 'bg-opacity-50 cursor-not-allowed border-transparent' : 'hover:border-gray-600'}`}
                                                            placeholder="Nombre de las oficinas donde se encuentra este modelo..."
                                                            value={modelData.offices}
                                                            onChange={(e) => handleOfficeChange(model, e.target.value)}
                                                            onBlur={() => handleBlur(model)}
                                                        />
                                                    </div>
                                                )}
                                            </div>

                                            {!isCollapsed && (
                                                <div className="overflow-x-auto custom-scrollbar">
                                                <table className="w-full text-left border-collapse">
                                                    <thead>
                                                        <tr className="bg-surface-darker/50 text-[#9da8b9] text-[10px] uppercase tracking-widest font-bold">
                                                            <th className="px-6 py-3 border-b border-border-dark">Tipo de Insumo</th>
                                                            <th className="px-6 py-3 border-b border-border-dark">Referencia</th>
                                                            <th className="px-6 py-3 border-b border-border-dark">Color</th>
                                                            <th className="px-6 py-3 border-b border-border-dark w-32">Stock Mínimo</th>
                                                            <th className="px-6 py-3 border-b border-border-dark w-40">Stock Actual</th>
                                                            <th className="px-6 py-3 border-b border-border-dark text-right">Acciones</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-border-dark">
                                                        {modelData.supplies.map((item, idx) => (
                                                            <tr key={idx} className="hover:bg-white/5 transition-colors group">
                                                                <td className="px-6 py-4">
                                                                    <select 
                                                                        disabled={!isEditing}
                                                                        className={`bg-[#101822] border-border-dark text-gray-200 text-sm rounded-md w-full focus:ring-1 focus:ring-primary ${!isEditing ? 'appearance-none bg-transparent border-transparent cursor-default' : ''}`}
                                                                        value={item.type}
                                                                        onChange={(e) => handleChange(model, idx, 'type', e.target.value)}
                                                                        onBlur={() => handleBlur(model)}
                                                                    >
                                                                        {tipoItems.map(t => <option key={t} value={t}>{t}</option>)}
                                                                    </select>
                                                                </td>
                                                                <td className="px-6 py-4">
                                                                    <input 
                                                                        type="text" 
                                                                        disabled={!isEditing}
                                                                        className={`bg-[#101822] border-border-dark text-gray-200 text-sm rounded-md w-full focus:ring-1 focus:ring-primary ${!isEditing ? 'bg-transparent border-transparent cursor-default' : ''}`}
                                                                        value={item.reference}
                                                                        placeholder="Ej: CF258A"
                                                                        onChange={(e) => handleChange(model, idx, 'reference', e.target.value)}
                                                                        onBlur={() => handleBlur(model)}
                                                                    />
                                                                </td>
                                                                <td className="px-6 py-4">
                                                                    <select 
                                                                        disabled={!isEditing}
                                                                        className={`bg-[#101822] border-border-dark text-gray-200 text-sm rounded-md w-full focus:ring-1 focus:ring-primary ${!isEditing ? 'appearance-none bg-transparent border-transparent cursor-default' : ''}`}
                                                                        value={item.color}
                                                                        onChange={(e) => handleChange(model, idx, 'color', e.target.value)}
                                                                        onBlur={() => handleBlur(model)}
                                                                    >
                                                                        {colorItems.map(c => <option key={c} value={c}>{c}</option>)}
                                                                    </select>
                                                                </td>
                                                                <td className="px-6 py-4">
                                                                    <input 
                                                                        type="number" 
                                                                        disabled={!isEditing}
                                                                        className={`bg-[#101822] border-border-dark text-gray-200 text-sm rounded-md w-20 focus:ring-1 focus:ring-primary ${!isEditing ? 'bg-transparent border-transparent cursor-default' : ''}`}
                                                                        value={item.minStock}
                                                                        onChange={(e) => handleChange(model, idx, 'minStock', parseInt(e.target.value) || 0)}
                                                                        onBlur={() => handleBlur(model)}
                                                                    />
                                                                </td>
                                                                <td className="px-6 py-4">
                                                                    <div className="flex items-center gap-2">
                                                                        <button 
                                                                            onClick={() => adjustStock(model, idx, -1)}
                                                                            className="size-8 flex items-center justify-center rounded-md bg-red-500/10 text-red-500 hover:bg-red-500/20 transition-colors">
                                                                            <span className="material-symbols-outlined" style={{fontSize: '18px'}}>remove</span>
                                                                        </button>
                                                                        <span className={`text-sm font-bold w-8 text-center ${item.currentStock <= item.minStock ? 'text-red-500 animate-pulse' : 'text-white'}`}>
                                                                            {item.currentStock}
                                                                        </span>
                                                                        <button 
                                                                            onClick={() => adjustStock(model, idx, 1)}
                                                                            className="size-8 flex items-center justify-center rounded-md bg-green-500/10 text-green-500 hover:bg-green-500/20 transition-colors">
                                                                            <span className="material-symbols-outlined" style={{fontSize: '18px'}}>add</span>
                                                                        </button>
                                                                    </div>
                                                                </td>
                                                                <td className="px-6 py-4 text-right">
                                                                    <button 
                                                                        disabled={!isEditing}
                                                                        onClick={() => handleRemoveRow(model, idx)}
                                                                        className={`transition-colors opacity-0 group-hover:opacity-100 ${isEditing ? 'text-gray-500 hover:text-red-500' : 'text-gray-700 cursor-not-allowed'}`}>
                                                                        <span className="material-symbols-outlined" style={{fontSize: '20px'}}>delete</span>
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                        {modelData.supplies.length === 0 && (
                                                            <tr>
                                                                <td colSpan="6" className="px-6 py-10 text-center text-gray-500 italic text-sm">
                                                                    No hay insumos registrados para este modelo. Haga clic en "Agregar Insumo" para empezar.
                                                                </td>
                                                            </tr>
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                    {/* Add Model Modal */}
                    {showAddModelModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                            <div className="bg-surface-dark border border-border-dark w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
                                <div className="p-6 border-b border-border-dark">
                                    <div className="flex items-center gap-3 text-white mb-1">
                                        <span className="material-symbols-outlined text-primary">add_circle</span>
                                        <h3 className="text-xl font-bold tracking-tight">Agregar Nueva Impresora</h3>
                                    </div>
                                    <p className="text-gray-400 text-sm">Ingrese el nombre del modelo para agrupar sus insumos</p>
                                </div>
                                <div className="p-6 space-y-4">
                                    <div className="space-y-2">
                                        <label className="text-xs font-bold text-gray-400 uppercase tracking-wider">Nombre del Modelo</label>
                                        <input 
                                            type="text" 
                                            className="w-full bg-[#101822] border border-border-dark rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all"
                                            placeholder="Ej: HP LaserJet 404n"
                                            value={newModelName}
                                            onChange={(e) => setNewModelName(e.target.value)}
                                            onKeyDown={(e) => e.key === 'Enter' && handleAddModel()}
                                            autoFocus
                                        />
                                    </div>
                                </div>
                                <div className="p-6 bg-[#101822]/50 flex gap-3 justify-end">
                                    <button 
                                        onClick={() => setShowAddModelModal(false)}
                                        className="px-4 py-2 text-sm font-bold text-gray-400 hover:text-white transition-colors">
                                        Cancelar
                                    </button>
                                    <button 
                                        onClick={() => handleAddModel()}
                                        className="px-6 py-2 bg-primary hover:bg-blue-600 text-white text-sm font-bold rounded-lg shadow-lg shadow-primary/20 transition-all">
                                        Crear Grupo
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            return (
                <MemoryRouter>
                    <Routes>
                        <Route path="/" element={<InventoryDetailsPage />} />
                        <Route path="/supplies" element={<SuppliesInventoryPage />} />
                    </Routes>
                </MemoryRouter>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
